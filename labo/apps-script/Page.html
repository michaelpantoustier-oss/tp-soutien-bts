<style>
/* Suivi labo — charte interne Aurlom BTS+ (Guide interne Aurlom, jetons du design system). */
:root {
  --papier: #ffffff; --pierre: #f5f4f1; --encre: #111111; --encre-sourde: #5c5a57; --encre-faible: #8c8c8c;
  --filet: #e2dfda; --filet-fort: #cfccc7; --violet: #c57aff; --violet-profond: #902edb; --violet-pale: #f4ecff;
  --violet-2: #cdb0ff; --violet-nuit: #391959; --vert: #1d7a50; --vert-pale: #e8f4ee; --ambre: #a85f00;
  --ambre-pale: #fbf1e3; --rouge-pale: #fbeceb; --sur-encre: #e9e6e2; --sur-encre-sourd: #bdb9b4;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-xs: 3px; --radius-sm: 5px; --radius-md: 8px;
  --filet-fin: 1px solid var(--filet); --filet-encre: 1px solid var(--encre);
  --inclinaison: -8deg;
  --font-display: 'Poppins', system-ui, sans-serif;
  --font-sans: 'Hanken Grotesk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papier); color: var(--encre); font-family: var(--font-sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.page { max-width: 1040px; margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-7); }
button, input, select, textarea { font: inherit; color: inherit; }

/* Titres */
.sur { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--violet-profond); margin: 0; }
h1 { font-family: var(--font-display); font-weight: 900; font-style: italic; font-size: clamp(32px, 7vw, 45px); line-height: 1; letter-spacing: -0.02em; margin: var(--space-5) 0 var(--space-5); display: inline-block; transform: rotate(var(--inclinaison)); transform-origin: left bottom; }
h1 .point, h2 .point { color: var(--violet); }
h2 { font-family: var(--font-display); font-weight: 900; font-style: italic; font-size: 23px; line-height: 1.15; letter-spacing: -0.01em; margin: var(--space-6) 0 var(--space-4); }
h3 { font-size: 16px; font-weight: 700; margin: 0 0 var(--space-2); }
.lead { font-size: 17px; margin: 0 0 var(--space-5); color: var(--encre-sourde); max-width: 640px; }
.label, th, .champ > span { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--encre-faible); }
.sourd { color: var(--encre-sourde); }
.petit { font-size: 14px; }
.mono { font-family: var(--font-mono); font-size: 13px; }

/* En-tête */
.entete { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; padding-bottom: var(--space-3); border-bottom: var(--filet-encre); }
.entete .qui { font-size: 14px; color: var(--encre-sourde); }
.entete .qui b { color: var(--encre); }
.demo { background: var(--ambre-pale); border-left: 3px solid var(--ambre); padding: var(--space-2) var(--space-3); font-size: 14px; margin: var(--space-3) 0 0; display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; justify-content: space-between; }

/* Onglets */
.onglets { display: flex; gap: var(--space-1); overflow-x: auto; margin: var(--space-4) 0 0; border-bottom: var(--filet-fin); scrollbar-width: none; }
.onglets button { background: none; border: 0; border-bottom: 2px solid transparent; padding: var(--space-2) var(--space-3); font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--encre-sourde); cursor: pointer; white-space: nowrap; }
.onglets button[aria-selected="true"] { color: var(--encre); border-bottom-color: var(--violet); }
.onglets .compte { font-family: var(--font-mono); color: var(--violet-profond); margin-left: 4px; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-4); border-radius: var(--radius-sm); border: var(--filet-encre); background: var(--papier); color: var(--encre); font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--pierre); }
.btn.plein { background: var(--encre); color: var(--papier); }
.btn.plein:hover { background: #2a2a2a; }
.btn.violet { background: var(--violet-profond); border-color: var(--violet-profond); color: var(--papier); }
.btn.lien { border: 0; background: none; color: var(--violet-profond); padding: 0; min-height: 0; }
.btn.petit { min-height: 34px; padding: 0 var(--space-3); font-size: 13px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible, .onglets button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .seg label:focus-within { outline: 2px solid var(--violet-profond); outline-offset: 2px; }
.actions { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-3); }

/* Formulaires */
.grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-3) var(--space-4); }
.champ { display: flex; flex-direction: column; gap: var(--space-1); }
.champ.large { grid-column: 1 / -1; }
input, select, textarea { width: 100%; min-height: 44px; padding: var(--space-2) var(--space-3); border: var(--filet-fin); border-color: var(--filet-fort); border-radius: var(--radius-sm); background: var(--papier); font-size: 16px; }
textarea { min-height: 88px; resize: vertical; }
.cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-2); }
.case { display: flex; gap: var(--space-2); align-items: flex-start; padding: var(--space-2) var(--space-3); border: var(--filet-fin); border-radius: var(--radius-sm); cursor: pointer; }
.case input { width: 18px; height: 18px; min-height: 0; margin: 3px 0 0; accent-color: var(--violet-profond); flex: none; }
.case:has(input:checked) { border-color: var(--violet-2); background: var(--violet-pale); }

/* Segmenté OK / NC / N.A. */
.controle { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: var(--filet-fin); }
.seg { display: inline-flex; border: var(--filet-fin); border-color: var(--filet-fort); border-radius: var(--radius-sm); overflow: hidden; flex: none; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; }
.seg span { display: block; padding: var(--space-2) var(--space-3); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; min-width: 52px; text-align: center; }
.seg label + label span { border-left: var(--filet-fin); }
.seg input:checked + span.ok { background: var(--vert-pale); color: var(--vert); }
.seg input:checked + span.nc { background: var(--rouge-pale); color: var(--violet-profond); }
.seg input:checked + span.na { background: var(--pierre); color: var(--encre-sourde); }

/* Cartes, encarts, panneau */
.carte { border: var(--filet-fin); border-radius: var(--radius-sm); padding: var(--space-4); margin-bottom: var(--space-3); background: var(--papier); }
.carte .tete { display: flex; justify-content: space-between; gap: var(--space-3); align-items: flex-start; flex-wrap: wrap; }
.carte .meta { font-size: 14px; color: var(--encre-sourde); margin: var(--space-1) 0 0; }
.carte p { margin: var(--space-2) 0 0; }
details.carte summary { cursor: pointer; list-style: none; }
details.carte summary::-webkit-details-marker { display: none; }
.encart { padding: var(--space-3) var(--space-4); border-left: 3px solid var(--encre); background: var(--pierre); margin: var(--space-3) 0; font-size: 14px; }
.encart.ambre { background: var(--ambre-pale); border-color: var(--ambre); }
.encart.vert { background: var(--vert-pale); border-color: var(--vert); }
.encart.urgent { background: var(--rouge-pale); border-color: var(--violet-profond); }
.panneau { background: var(--encre); color: var(--sur-encre); border-radius: var(--radius-md); padding: var(--space-5); margin: var(--space-4) 0; }
.panneau .label { color: var(--sur-encre-sourd); }
.panneau .heure { font-family: var(--font-display); font-weight: 900; font-style: italic; font-size: clamp(44px, 12vw, 64px); line-height: 1; letter-spacing: -0.02em; display: inline-block; transform: rotate(var(--inclinaison)); transform-origin: left bottom; margin: var(--space-4) 0 var(--space-4); color: var(--papier); }
.panneau .heure .point { color: var(--violet); }
.panneau select { background: var(--encre); color: var(--sur-encre); border-color: #3a3a3a; }
.panneau .btn.badge { width: 100%; min-height: 64px; font-size: 18px; background: var(--violet); border-color: var(--violet); color: var(--encre); }
.panneau .btn.badge:hover { background: var(--violet-2); }
.panneau .sourd { color: var(--sur-encre-sourd); }

/* Badges d'état (toujours un mot + une couleur) */
.badge { display: inline-block; font-family: var(--font-display); font-size: 11px; line-height: 1; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 7px; border-radius: var(--radius-xs); white-space: nowrap; vertical-align: middle; background: var(--pierre); color: var(--encre-sourde); }
.badge.vert { background: var(--vert-pale); color: var(--vert); }
.badge.ambre { background: var(--ambre-pale); color: var(--ambre); }
.badge.violet { background: var(--violet-pale); color: var(--violet-profond); }
.badge.urgent { background: var(--rouge-pale); color: var(--violet-profond); }
.badge.encre { background: var(--encre); color: var(--sur-encre); }

/* Chiffres clés */
.chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: var(--filet-encre); margin: var(--space-4) 0; }
.chiffre { padding: var(--space-4) var(--space-4) var(--space-4) 0; border-bottom: var(--filet-fin); }
.chiffre b { display: inline-block; font-family: var(--font-display); font-weight: 900; font-style: italic; font-size: 38px; line-height: 1; letter-spacing: -0.02em; transform: rotate(var(--inclinaison)); transform-origin: left bottom; margin: var(--space-2) 0 var(--space-3); }
.chiffre.accent b { color: var(--violet-profond); }
.chiffre span { display: block; font-size: 14px; color: var(--encre-sourde); line-height: 1.4; }

/* Tableaux */
.tableau-wrap { overflow-x: auto; margin: var(--space-3) 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; padding: var(--space-2) var(--space-3) var(--space-2) 0; border-bottom: var(--filet-encre); white-space: nowrap; }
td { padding: var(--space-3) var(--space-3) var(--space-3) 0; border-bottom: var(--filet-fin); vertical-align: top; }
td:first-child { font-weight: 600; }
td.num, th.num, td.mono { white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tfoot td { border-top: var(--filet-encre); border-bottom: 0; font-weight: 700; }

/* Fil de messages */
.fil { margin-top: var(--space-3); border-top: var(--filet-fin); padding-top: var(--space-3); }
.msg { padding: var(--space-2) 0; font-size: 14px; }
.msg .de { font-weight: 700; }
.msg.systeme { color: var(--encre-faible); font-size: 13px; }
.fil form { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
.fil input { flex: 1; }

.vide { color: var(--encre-faible); font-size: 14px; padding: var(--space-3) 0; }
.toast { position: fixed; left: 50%; bottom: var(--space-5); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--encre); color: var(--sur-encre); padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); font-size: 14px; z-index: 10; }
.toast.erreur { background: var(--violet-nuit); }
.connexion { max-width: 420px; margin: var(--space-6) auto 0; }
.cache { display: none !important; }
.deux { display: grid; grid-template-columns: 1fr; gap: var(--space-5); }
@media (min-width: 860px) { .deux { grid-template-columns: 1fr 1fr; } }

/* Programme et commandes */
ul.materiel { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--space-1); font-size: 14px; }
ul.materiel li::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--violet); margin-right: var(--space-2); vertical-align: middle; }
fieldset.devis { border: var(--filet-fin); border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4); margin: var(--space-4) 0 0; }
fieldset.devis legend { padding: 0 var(--space-2); }
.devis-ligne + .devis-ligne { margin-top: var(--space-3); padding-top: var(--space-3); border-top: var(--filet-fin); }

/* Impression du relevé mensuel */
.imprimable { display: none; }
@media print {
  body * { visibility: hidden; }
  .imprimable, .imprimable * { visibility: visible; }
  .imprimable { display: block; position: absolute; inset: 0; padding: 18mm; font-size: 10pt; }
  .imprimable h1 { font-size: 25pt; transform: none; margin: 4mm 0 6mm; }
  .imprimable .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 12mm; margin-top: 14mm; }
  .imprimable .signatures div { border-top: 1px solid #111; padding-top: 2mm; min-height: 22mm; }
  .imprimable .pied { margin-top: 10mm; font-size: 8pt; color: #8c8c8c; display: flex; justify-content: space-between; }
}

/* Boîte de dialogue intégrée */
dialog.boite { border: var(--filet-encre); border-radius: var(--radius-md); padding: var(--space-5); max-width: min(480px, calc(100% - 32px)); width: 100%; background: var(--papier); color: var(--encre); }
dialog.boite::backdrop { background: rgba(17, 17, 17, 0.45); }
dialog.boite > p:first-child { font-weight: 700; margin: 0 0 var(--space-3); }
details.carte summary .tete { margin: 0; }

/* ------------------------------------------------------------------ */
/* Codes couleurs (palette de la charte interne : états, filières)     */
/* ------------------------------------------------------------------ */
.entete .marque { display: flex; align-items: center; gap: var(--space-3); }
.logo { display: block; height: 28px; width: auto; }
.connexion .logo { height: 32px; margin-bottom: var(--space-2); }
.imprimable .logo { height: 32px; }

/* Filet gauche de 3 px dans la couleur de l'état, comme l'Encart de la charte */
.carte.etat-vert { border-left: 3px solid var(--vert); }
.carte.etat-ambre { border-left: 3px solid var(--ambre); }
.carte.etat-urgent { border-left: 3px solid var(--violet-profond); }
.carte.etat-violet { border-left: 3px solid var(--violet); }
.carte.etat-eteint { border-left: 3px solid var(--filet-fort); }
.carte.etat-eteint h3, .carte.etat-eteint p { color: var(--encre-sourde); }
tr.etat-urgent td:first-child { border-left: 3px solid var(--violet-profond); padding-left: var(--space-2); }
tr.etat-ambre td:first-child { border-left: 3px solid var(--ambre); padding-left: var(--space-2); }

/* Étiquettes de filière */
.filiere { display: inline-block; font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1; padding: 4px 6px; border-radius: var(--radius-xs); vertical-align: middle; white-space: nowrap; }
.filiere.f-biomed { background: var(--violet-nuit); color: var(--papier); }
.filiere.f-bioalc { background: var(--encre); color: var(--papier); }
.filiere.f-commun { background: var(--pierre); color: var(--encre-sourde); }

/* Pied de page et légende */
.pied { margin-top: var(--space-7); border-top: var(--filet-fin); padding-top: var(--space-3); }
.pied-ligne { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); font-size: 11px; color: var(--encre-faible); margin-top: var(--space-3); }
.pied-num { font-family: var(--font-mono); font-weight: 600; font-size: 13px; color: var(--violet-profond); }
.legende summary { cursor: pointer; }
.legende-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-2) var(--space-5); margin-top: var(--space-3); font-size: 14px; color: var(--encre-sourde); }
.legende-grille p { margin: 0; }
@media print { .pied { display: none; } }

</style>
</head>

      'seuil', 'peremption', 'emplacement', 'notes', 'maj_le', 'maj_par', 'actif'],
    Mouvements: ['id', 'horodatage', 'article_id', 'designation', 'delta', 'quantite_apres', 'motif',
      'demande_tp_id', 'user_id', 'user_nom'],
    Commandes: ['id', 'cree_le', 'user_id', 'user_nom', 'filiere', 'designation', 'reference', 'quantite',
      'prix_unitaire_ttc', 'total_ttc', 'fournisseur', 'lien', 'justification', 'demande_tp_id', 'sequence_id',
      'article_id', 'devis', 'statut', 'approuve_par', 'approuve_le', 'motif_refus', 'pilotage_id', 'maj_le'],
    Fournisseurs: ['nom', 'domaine', 'categories', 'contact', 'email', 'telephone', 'notes'],
    Programme: ['id', 'filiere', 'annee', 'matiere', 'bloc', 'semaines', 'debut', 'fin', 'titre', 'tp', 'renforcement', 'materiel'],
    Journal: ['horodatage', 'user_id', 'user_nom', 'action', 'cible', 'detail']
  };

  var STATUTS_DEMANDE = { demandee: 'demandée', prise_en_charge: 'prise en charge', prete: 'prête', realisee: 'réalisée', annulee: 'annulée' };
  var STATUTS_COMMANDE = { soumise: 'soumise', approuvee: 'approuvée', refusee: 'refusée', commandee: 'commandée', livree: 'livrée', annulee: 'annulée' };

  function erreur(msg) { var e = new Error(msg); e.metier = true; return e; }

  // Le directeur a tous les droits, sauf ceux qui n'ont de sens que pour l'équipe du labo.
  function peut(user, droit) {
    if (user.role === 'directeur') return droit !== 'badge' && droit !== 'preparerTP';
    return DROITS[droit].indexOf(user.role) !== -1;
  }
  function exiger(user, droit) { if (!peut(user, droit)) throw erreur('Action non autorisée pour ton rôle.'); }

  // Filières d'une personne (« BIOMED,BIOALC ») ; liste vide = les deux.
  function filieresDe(u) {
    return String(u.filiere || '').split(/[,;| ]+/).filter(function (f) { return CONFIG.filieres[f]; });
  }
  function aFiliere(u, f) { var l = filieresDe(u); return !l.length || l.indexOf(f) !== -1; }
  function filiereUnique(u) { var l = filieresDe(u); return l.length === 1 ? l[0] : ''; }

  function filiereDeClasse(classe) {
    for (var k in CONFIG.filieres) if (CONFIG.filieres[k].classes.indexOf(classe) !== -1) return k;
    return '';
  }

  function joursEntre(a, b) {
    var x = Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8, 10));
    var y = Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8, 10));
    return Math.round((y - x) / 86400000);
  }

  function texte(v, max) {
    var s = (v === undefined || v === null) ? '' : String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').trim();
    return max ? s.slice(0, max) : s;
  }
  function liste(v) { return Array.isArray(v) ? v.map(function (x) { return texte(x, 200); }).filter(Boolean) : []; }
  function nombre(v) { var n = Number(String(v === undefined || v === null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; }
  function arrondi(n) { return Math.round(n * 100) / 100; }
  function ymd(v) { return /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : ''; }

  function create(store, env) {

    function now() { return env.now(); }
    function iso(d) { return d.toISOString(); }
    function jour(d) { return env.format(d, 'yyyy-MM-dd'); }
    function nouvelId(p) { return p + '-' + now().getTime().toString(36).toUpperCase() + env.random(4); }

    function journal(user, action, cible, detail) {
      store.insert('Journal', {
        horodatage: iso(now()), user_id: user ? user.id : '', user_nom: user ? user.nom : '',
        action: action, cible: cible || '', detail: typeof detail === 'string' ? detail : JSON.stringify(detail || {}).slice(0, 2000)
      });
    }

    function actifs() {
      return store.all('Utilisateurs').filter(function (u) { return String(u.actif).toLowerCase() === 'oui' && CONFIG.roles[u.role]; });
    }
    function trouverUser(id) { return actifs().filter(function (u) { return String(u.id) === String(id); })[0] || null; }

    // -------------------------------------------------------------------------
    // Authentification : e-mail + PIN, jeton de session, blocage après échecs.
    // -------------------------------------------------------------------------
    function connexion(data) {
      var email = texte(data.email, 120).toLowerCase();
      var pin = texte(data.pin, 20);
      var cle = 'echecs:' + email;
      var echecs = Number(env.cache.get(cle) || 0);
      if (echecs >= CONFIG.essaisMax) throw erreur('Trop d\'essais. Réessaie dans ' + CONFIG.blocageMinutes + ' minutes.');
      var u = actifs().filter(function (x) { return String(x.email).toLowerCase() === email; })[0];
      var ok = u && u.pin_hash && pin.length >= 4 && env.hashPin(u.id, pin) === String(u.pin_hash);
      if (!ok) {
        env.cache.put(cle, String(echecs + 1), CONFIG.blocageMinutes * 60);
        journal(u || { id: '', nom: email }, 'connexion_refusee', '', '');
        throw erreur('E-mail ou code PIN incorrect.');
      }
      env.cache.remove(cle);
      var jeton = env.randomToken();
      env.sessions.put(jeton, { uid: u.id, exp: now().getTime() + CONFIG.dureeSessionJours * 86400000 });
      journal(u, 'connexion', '', '');
      return { jeton: jeton, moi: profil(u) };
    }

    function authentifier(jeton) {
      if (!jeton) throw erreur('Session expirée. Reconnecte-toi.');
      var s = env.sessions.get(jeton);
      if (!s || s.exp < now().getTime()) { if (s) env.sessions.remove(jeton); throw erreur('Session expirée. Reconnecte-toi.'); }
      var u = trouverUser(s.uid);
      if (!u) { env.sessions.remove(jeton); throw erreur('Compte désactivé.'); }
      return u;
    }

    function profil(u) {
      var droits = {};
      Object.keys(DROITS).forEach(function (d) { droits[d] = peut(u, d); });
      return { id: u.id, nom: u.nom, role: u.role, filiere: u.filiere || '', disciplines: u.disciplines || '', droits: droits };
    }

    function notifier(roles, sujet, corps, filiere) {
      if (!env.notify) return;
      actifs().forEach(function (u) {
        if (roles.indexOf(u.role) === -1 || !u.email) return;
        if (filiere && !aFiliere(u, filiere) && u.role !== 'directeur') return;
        env.notify(u.email, sujet, corps);
      });
    }

    function sessionOuverte(userId) {
      return store.all('Sessions').filter(function (s) { return String(s.user_id) === String(userId) && s.statut === 'en_cours'; })[0] || null;
    }

    function heureBadge(data) {
      if (data && data.hors_ligne && data.client_time) {
        var d = new Date(data.client_time);
        if (!isNaN(d.getTime()) && d <= now() && now() - d < 3 * 86400000) return { date: d, source: 'hors_ligne' };
      }
      return { date: now(), source: 'badge' };
    }

    function heureLocale(dateStr, hhmm) {
      if (!ymd(dateStr) || !/^\d{1,2}:\d{2}$/.test(hhmm || '')) throw erreur('Date ou heure invalide.');
      return env.parseLocal(dateStr, hhmm);
    }

    function dureeMin(a, b) { return Math.round((new Date(b).getTime() - new Date(a).getTime()) / 60000); }

    function article(id) { return store.get('Articles', id); }

    function mouvementStock(user, art, delta, motif, demandeId) {
      var q = nombre(art.quantite) || 0;
      var apres = arrondi(q + delta);
      if (apres < 0) throw erreur('Stock insuffisant : il reste ' + q + ' ' + (art.unite || '') + ' de « ' + art.designation + ' ».');
      store.update('Articles', art.id, { quantite: apres, maj_le: iso(now()), maj_par: user.nom });
      var m = {
        id: nouvelId('MV'), horodatage: iso(now()), article_id: art.id, designation: art.designation,
        delta: delta, quantite_apres: apres, motif: motif, demande_tp_id: demandeId || '', user_id: user.id, user_nom: user.nom
      };
      store.insert('Mouvements', m);
      var seuil = nombre(art.seuil);
      if (delta < 0 && isFinite(seuil) && apres <= seuil && q > seuil) {
        notifier(['technicienne', 'aide_laborantine', 'prof_referent'], '[Labo] Stock bas – ' + art.designation,
          'Il reste ' + apres + ' ' + (art.unite || '') + ' (seuil : ' + seuil + '). Pense à proposer une commande dans le suivi labo.', art.filiere);
      }
      return m;
    }

    // -------------------------------------------------------------------------
    var A = {};

    A.deconnexion = function (user, data, jeton) { if (jeton) env.sessions.remove(jeton); journal(user, 'deconnexion', '', ''); return true; };

    A.etat = function (user) {
      var auj = jour(now());
      var r = { moi: profil(user), config: CONFIG, aujourdhui: auj };
      var sessions = store.all('Sessions');
      var demandes = store.all('Demandes');
      var estProf = user.role === 'enseignant';

      r.presentes = sessions.filter(function (s) { return s.statut === 'en_cours'; })
        .map(function (s) { return { user_nom: s.user_nom, arrivee: s.arrivee, labo: s.labo, source: s.source }; });

      if (peut(user, 'badge')) {
        r.sessionOuverte = sessionOuverte(user.id);
        r.sessions = sessions.filter(function (s) { return String(s.user_id) === String(user.id); });
      }
      if (peut(user, 'voirEquipe')) r.sessions = sessions;

      r.demandes = estProf ? demandes.filter(function (d) { return String(d.prof_id) === String(user.id); }) : demandes;
      var ids = r.demandes.map(function (d) { return String(d.id); });
      r.messages = store.all('Messages').filter(function (m) { return ids.indexOf(String(m.demande_id)) !== -1; });

      var incidents = store.all('Incidents');
      r.incidents = estProf ? incidents.filter(function (i) { return String(i.user_id) === String(user.id) || i.statut !== 'resolu'; }) : incidents;
      if (!estProf) r.rangements = store.all('Rangements').slice(-150);

      r.articles = store.all('Articles').filter(function (a) { return String(a.actif).toLowerCase() !== 'non'; });
      r.mouvements = store.all('Mouvements').slice(-200);

      var commandes = store.all('Commandes');
      r.commandes = estProf ? commandes.filter(function (c) { return String(c.user_id) === String(user.id); }) : commandes;
      r.fournisseurs = store.all('Fournisseurs');

      var debut = env.format(new Date(now().getTime() - 14 * 86400000), 'yyyy-MM-dd');
      var fin = env.format(new Date(now().getTime() + 70 * 86400000), 'yyyy-MM-dd');
      r.programme = store.all('Programme').filter(function (p) {
        return (!p.fin || p.fin >= debut) && (!p.debut || p.debut <= fin) && (!estProf || aFiliere(user, p.filiere));
      });

      if (peut(user, 'piloterTP') || peut(user, 'voirEquipe') || peut(user, 'approuverCommande')) {
        r.utilisateurs = actifs().map(function (u) {
          var o = { id: u.id, nom: u.nom, role: u.role, filiere: u.filiere || '' };
          if (peut(user, 'facturation')) o.taux_horaire = u.taux_horaire;
          return o;
        });
      }
      return r;
    };

    A.programme = function (user, data) {
      var f = texte(data.filiere, 10);
      return store.all('Programme').filter(function (p) { return !f || p.filiere === f; });
    };

    // --- Présence -------------------------------------------------------------
    A.arrivee = function (user, data) {
      exiger(user, 'badge');
      var o = sessionOuverte(user.id);
      if (o) throw erreur('Une présence est déjà ouverte depuis le ' + env.format(new Date(o.arrivee), 'dd/MM à HH:mm') + '. Déclare d\'abord ton départ.');
      var h = heureBadge(data);
      var s = {
        id: nouvelId('S'), user_id: user.id, user_nom: user.nom, date: jour(h.date), arrivee: iso(h.date),
        depart: '', duree_min: '', labo: texte(data.labo, 80), missions: '', demandes_ids: '', commentaire: '',
        source: h.source, corrections: '', statut: 'en_cours', valide_par: '', valide_le: '', motif_validation: ''
      };
      store.insert('Sessions', s);
      journal(user, 'arrivee', s.id, { source: h.source });
      return s;
    };

    A.depart = function (user, data) {
      exiger(user, 'badge');
      var s = sessionOuverte(user.id);
      if (!s) throw erreur('Aucune présence ouverte.');
      var missions = liste(data.missions);
      if (!missions.length) throw erreur('Coche au moins une mission réalisée.');
      var corr = '', fin;
      if (data.heure_depart) {
        fin = heureLocale(s.date, data.heure_depart);
        corr = 'Départ saisi à la main le ' + env.format(now(), 'dd/MM/yyyy HH:mm');
      } else {
        var h = heureBadge(data); fin = h.date;
        if (h.source === 'hors_ligne') corr = 'Départ enregistré hors connexion';
      }
      if (fin.getTime() <= new Date(s.arrivee).getTime()) throw erreur('L\'heure de départ doit suivre l\'arrivée.');
      if (fin > now()) throw erreur('L\'heure de départ ne peut pas être dans le futur.');
      var duree = dureeMin(s.arrivee, iso(fin));
      if (duree / 60 > CONFIG.alerteSessionHeures) corr = (corr ? corr + ' ; ' : '') + 'Durée supérieure à ' + CONFIG.alerteSessionHeures + ' h';
      var patch = {
        depart: iso(fin), duree_min: duree, missions: missions.join(' | '),
        demandes_ids: liste(data.demandes_ids).join(' | '), commentaire: texte(data.commentaire, 1000),
        corrections: corr, statut: 'a_valider'
      };
      store.update('Sessions', s.id, patch);
      journal(user, 'depart', s.id, patch);
      return Object.assign({}, s, patch);
    };

    A.saisieManuelle = function (user, data) {
      exiger(user, 'badge');
      var motif = texte(data.motif, 500);
      if (!motif) throw erreur('Indique pourquoi la présence n\'a pas été badgée.');
      var debut = heureLocale(data.date, data.debut), fin = heureLocale(data.date, data.fin);
      if (fin <= debut) throw erreur('L\'heure de fin doit suivre l\'heure de début.');
      if (fin > now()) throw erreur('Impossible de déclarer une présence future.');
      var missions = liste(data.missions);
      if (!missions.length) throw erreur('Coche au moins une mission réalisée.');
      var s = {
        id: nouvelId('S'), user_id: user.id, user_nom: user.nom, date: data.date, arrivee: iso(debut), depart: iso(fin),
        duree_min: dureeMin(iso(debut), iso(fin)), labo: texte(data.labo, 80), missions: missions.join(' | '),
        demandes_ids: liste(data.demandes_ids).join(' | '), commentaire: texte(data.commentaire, 1000),
        source: 'saisie_manuelle', corrections: 'Saisie a posteriori le ' + env.format(now(), 'dd/MM/yyyy HH:mm') + ' : ' + motif,
        statut: 'a_valider', valide_par: '', valide_le: '', motif_validation: ''
      };
      store.insert('Sessions', s);
      journal(user, 'saisie_manuelle', s.id, s);
      return s;
    };

    A.validerSession = function (user, data) {
      exiger(user, 'validerPresence');
      var s = store.get('Sessions', data.id);
      if (!s) throw erreur('Présence introuvable.');
      if (s.statut === 'en_cours') throw erreur('Présence encore ouverte.');
      var decision = data.decision === 'contestee' ? 'contestee' : 'validee';
      if (decision === 'contestee' && !texte(data.motif)) throw erreur('Un motif est nécessaire pour contester.');
      var patch = { statut: decision, valide_par: user.nom, valide_le: iso(now()), motif_validation: texte(data.motif, 500) };
      store.update('Sessions', s.id, patch);
      journal(user, 'validation_session', s.id, patch);
      return Object.assign({}, s, patch);
    };

    // Relevé mensuel. Les montants ne sortent que pour le directeur.
    A.releve = function (user, data) {
      var cible = data.user_id || user.id;
      var soi = String(cible) === String(user.id);
      if (!soi && !peut(user, 'voirEquipe')) throw erreur('Relevé réservé.');
      var mois = texte(data.mois);
      if (!/^\d{4}-\d{2}$/.test(mois)) throw erreur('Mois invalide.');
      var tech = store.all('Utilisateurs').filter(function (u) { return String(u.id) === String(cible); })[0];
      if (!tech) throw erreur('Personne introuvable.');
      var sessions = store.all('Sessions').filter(function (s) {
        return String(s.user_id) === String(cible) && String(s.date).slice(0, 7) === mois;
      }).sort(function (a, b) { return a.arrivee < b.arrivee ? -1 : 1; });
      // Journées validées : temps brut, pause déjeuner retirée, temps facturable.
      var P = CONFIG.pauseDejeuner;
      function minuteDuJour(isoStr) { var hm = env.format(new Date(isoStr), 'HH:mm'); return +hm.slice(0, 2) * 60 + +hm.slice(3, 5); }
      var pDeb = +P.debut.slice(0, 2) * 60 + +P.debut.slice(3, 5), pFin = +P.fin.slice(0, 2) * 60 + +P.fin.slice(3, 5);
      var parJour = {};
      sessions.forEach(function (s) { if (s.statut === 'validee' && s.depart) (parJour[s.date] = parJour[s.date] || []).push(s); });
      var jours = Object.keys(parJour).sort().map(function (date) {
        var l = parJour[date];
        var brut = l.reduce(function (t, s) { return t + (Number(s.duree_min) || 0); }, 0);
        var debut = Math.min.apply(null, l.map(function (s) { return minuteDuJour(s.arrivee); }));
        var fin = Math.max.apply(null, l.map(function (s) { return minuteDuJour(s.depart); }));
        var pause = 0;
        if (debut < pDeb && fin > pFin) {
          var dejaBadge = 0;
          for (var i = 1; i < l.length; i++) {
            var g1 = minuteDuJour(l[i - 1].depart), g2 = minuteDuJour(l[i].arrivee);
            dejaBadge += Math.max(0, Math.min(g2, pFin) - Math.max(g1, pDeb));
          }
          pause = Math.min(brut, Math.max(0, P.minutes - dejaBadge));
        }
        return { date: date, minutes_brutes: brut, pause_min: pause, minutes_facturables: brut - pause };
      });
      var brutes = jours.reduce(function (t, j) { return t + j.minutes_brutes; }, 0);
      var pauses = jours.reduce(function (t, j) { return t + j.pause_min; }, 0);
      var minutes = brutes - pauses;
      var demandes = store.all('Demandes');
      var prep = demandes.filter(function (d) { return String(d.prepa_id) === String(cible) && String(d.date_tp).slice(0, 7) === mois; })
        .map(function (d) { return { id: d.id, date_tp: d.date_tp, creneau: d.creneau, classe: d.classe, titre: d.titre, statut: d.statut }; });
      var r = {
        personne: { id: tech.id, nom: tech.nom, role: tech.role }, mois: mois, sessions: sessions,
        minutes_brutes: brutes, minutes_pause: pauses, jours: jours,
        minutes_validees: minutes, heures_validees: arrondi(minutes / 60),
        non_validees: sessions.filter(function (s) { return s.statut !== 'validee'; }).length,
        preparations: prep, edite_le: iso(now())
      };
      if (peut(user, 'facturation')) {
        var taux = nombre(tech.taux_horaire);
        r.taux_horaire = isFinite(taux) ? taux : 0;
        r.montant_ht = arrondi(minutes / 60 * r.taux_horaire);
        journal(user, 'releve_facturation', tech.id, mois);
      }
      return r;
    };

    // --- Rangement -------------------------------------------------------------
    A.rangement = function (user, data) {
      exiger(user, 'rangement');
      var labo = texte(data.labo, 80);
      if (!labo) throw erreur('Choisis le labo contrôlé.');
      var controles = {}, nc = [];
      CONFIG.controlesRangement.forEach(function (c) {
        var v = data.controles && data.controles[c];
        v = (v === 'ok' || v === 'nc' || v === 'na') ? v : 'na';
        controles[c] = v;
        if (v === 'nc') nc.push(c);
      });
      var h = now();
      var r = {
        id: nouvelId('R'), horodatage: iso(h), date: jour(h), user_id: user.id, user_nom: user.nom, labo: labo,
        demande_id: texte(data.demande_id, 40), controles: JSON.stringify(controles), nb_non_conformes: nc.length,
        remarques: texte(data.remarques, 1000)
      };
      store.insert('Rangements', r);
      journal(user, 'rangement', r.id, { labo: labo, nc: nc });
      if (nc.length) {
        A.incident(user, { labo: labo, categorie: 'Rangement non conforme', gravite: 'Faible',
          description: 'Contrôle ' + r.id + ' : ' + nc.join(', ') + (r.remarques ? '. ' + r.remarques : '') });
      }
      return r;
    };

    // --- Incidents -------------------------------------------------------------
    A.incident = function (user, data) {
      var description = texte(data.description, 2000);
      if (!description) throw erreur('Décris le problème.');
      var h = now();
      var i = {
        id: nouvelId('I'), horodatage: iso(h), date: jour(h), user_id: user.id, user_nom: user.nom, role: user.role,
        labo: texte(data.labo, 80),
        categorie: CONFIG.categoriesIncident.indexOf(data.categorie) !== -1 ? data.categorie : 'Autre',
        gravite: CONFIG.gravites.indexOf(data.gravite) !== -1 ? data.gravite : 'Gênant',
        description: description, statut: 'ouvert', traite_par: '', resolution: '', resolu_le: ''
      };
      store.insert('Incidents', i);
      journal(user, 'incident', i.id, { categorie: i.categorie, gravite: i.gravite });
      if (i.gravite === 'Bloquant') {
        notifier(['prof_referent', 'directeur', 'technicienne'], '[Labo] Incident bloquant – ' + i.categorie + (i.labo ? ' – ' + i.labo : ''),
          user.nom + ' a signalé le ' + env.format(h, 'dd/MM/yyyy à HH:mm') + ' :\n\n' + description + '\n\nRéf. ' + i.id);
      }
      return i;
    };

    A.majIncident = function (user, data) {
      exiger(user, 'traiterIncident');
      var i = store.get('Incidents', data.id);
      if (!i) throw erreur('Incident introuvable.');
      var statut = ['ouvert', 'en_cours', 'resolu'].indexOf(data.statut) !== -1 ? data.statut : i.statut;
      if (statut === 'resolu' && !texte(data.resolution)) throw erreur('Indique ce qui a été fait.');
      var patch = { statut: statut, traite_par: user.nom, resolution: texte(data.resolution, 1000) || i.resolution };
      if (statut === 'resolu') patch.resolu_le = iso(now());
      store.update('Incidents', i.id, patch);
      journal(user, 'maj_incident', i.id, patch);
      return Object.assign({}, i, patch);
    };

    // --- Demandes de TP --------------------------------------------------------
    A.demande = function (user, data) {

        date_tp: data.date_tp, creneau: texte(data.creneau, 40), labo: texte(data.labo, 80), classe: classe,
        discipline: texte(data.discipline, 80), competence: texte(data.competence, 200), sequence_id: texte(data.sequence_id, 40), tp_ref: texte(data.tp_ref, 20),

          if (['prise_en_charge', 'prete'].indexOf(statut) === -1) throw erreur('Tu peux passer une demande en « prise en charge » ou « prête ».');
          patch.statut = statut;

        }
      } else if (String(d.prof_id) === String(user.id)) {

    A.message = function (user, data) {

    // --- Commandes -------------------------------------------------------------
    A.commande = function (user, data) {

      if (!(pu >= 0)) throw erreur('Prix unitaire TTC estimé obligatoire (0 si inconnu).');
      var justification = texte(data.justification, 1500);
      if (!justification) throw erreur('La justification pédagogique est obligatoire (TP, séquence, bloc visé).');
      var filiere = ['BIOMED', 'BIOALC'].indexOf(data.filiere) !== -1 ? data.filiere : filiereUnique(user);

      var total = arrondi(quantite * pu);
      var devis = (Array.isArray(data.devis) ? data.devis : []).map(function (d) {
        return { fournisseur: texte(d && d.fournisseur, 80), montant: nombre(d && d.montant), lien: texte(d && d.lien, 300) };
      }).filter(function (d) { return d.fournisseur && d.montant > 0; });
      if (total >= CONFIG.seuilTroisDevisTTC) {
        var noms = {};

        id: nouvelId('C'), cree_le: iso(h), user_id: user.id, user_nom: user.nom, filiere: filiere, designation: designation,

      // Report dans le classeur Pilotage dépenses (statuts de ce classeur).

        try {
          if (c.pilotage_id) env.pilotage.maj(c.filiere, c.pilotage_id, STATUT_PILOTAGE[cible], signe);
          else if (cible !== 'annulee' && cible !== 'refusee') patch.pilotage_id = env.pilotage.ajouter(Object.assign({}, c, patch), STATUT_PILOTAGE[cible], signe || '') || '';

      if (cible === 'livree' && c.article_id) {
        var a = article(c.article_id);
        var q = nombre(data.quantite_recue);
        if (a) mouvementStock(user, a, q > 0 ? q : nombre(c.quantite), 'Réception de commande', '');
      }
      if (cible === 'approuvee' || cible === 'refusee') {
        var auteur = trouverUser(c.user_id);
        if (auteur && auteur.email && env.notify) {
          env.notify(auteur.email, '[Labo] Commande ' + STATUTS_COMMANDE[cible] + ' – ' + c.designation,
            user.nom + ' a ' + (cible === 'approuvee' ? 'approuvé' : 'refusé') + ' ta demande.' + (patch.motif_refus ? '\n\nMotif : ' + patch.motif_refus : ''));
        }

    // -------------------------------------------------------------------------
    var PUBLIQUES = { connexion: connexion };

    // Identité vérifiée par Google (déploiement réservé au domaine de l'école) :
    // le compte Google connecté est cherché dans la feuille Utilisateurs.
    function parCompteGoogle(email) {
      email = texte(email, 120).toLowerCase();

      var u = actifs().filter(function (x) { return String(x.email).toLowerCase() === email; })[0];

    // ctx.email : présent quand l'appel vient de la page servie par Apps Script.
    function handle(req, ctx) {

    return { handle: handle };
  }

  return {

})();

    var f = new Intl.DateTimeFormat('fr-FR', {

          materiel: ['Chaîne CLHP ou CPG', 'Colonnes', 'Solvants qualité HPLC', 'Étalons', 'Filtres seringue', 'Résines échangeuses d\'ions'] },
        { id: 'AC-BIO-3', intitule: 'Électrophorèse des protéines (agarose, SDS-PAGE)', codes: 'C2.3 · T2.2',
          description: 'Coulée, migration, révélation et profil densitométrique.',
          motsCles: 'électrophorèse|sds|polyacrylamide|page\\b|densitom',
          materiel: ['Cuve verticale et générateur', 'Gels ou réactifs de coulée', 'Marqueur de masse moléculaire', 'Bleu de Coomassie', 'Échantillons protéiques'] },
        { id: 'AC-BIO-4', intitule: 'Dosages spectrophotométriques, cinétiques et ELISA', codes: 'C2.3 · T2.2',
          description: 'Gammes d\'étalonnage externe, ajouts dosés, mesure d\'activité catalytique, ELISA sandwich ou compétitif en plaque 96 puits.',
          motsCles: 'dosage|spectrophotom|gamme|ajouts dosés|cinétique|activité|elisa|biuret|enzymat',
          materiel: ['Spectrophotomètre', 'Cuves', 'Réactifs de dosage', 'Kit ELISA', 'Lecteur de microplaques', 'Micropipettes et cônes'] }
      ] },
      { nom: 'Biologie moléculaire des acides nucléiques (C2.5, T2.2)', tps: [
        { id: 'AC-MOL-1', intitule: 'Extraction et dosage des acides nucléiques', codes: 'C2.5 · T2.2',
          description: 'Extraction d\'ADN ou d\'ARN sur colonnes, pureté et concentration (A260/A280).',
          motsCles: 'extraction|purification|acides nucléiques|\\badn\\b|\\barn\\b|a260',
          materiel: ['Kits d\'extraction sur colonnes', 'Microcentrifugeuse', 'Spectrophotomètre UV et microcuves', 'Éthanol', 'Tubes 1,5 mL'] },
        { id: 'AC-MOL-2', intitule: 'PCR et qPCR', codes: 'C2.5 · T2.2',
          description: 'Mélanges réactionnels en marche en avant, thermocycleur classique et en temps réel.',
          motsCles: '\\bpcr\\b|qpcr|temps réel|amplification|thermocycleur|marche en avant',
          materiel: ['Thermocycleur', 'Thermocycleur temps réel', 'Mix PCR et qPCR', 'Amorces et sondes', 'Plaques ou tubes PCR', 'Cônes à filtre'] },
        { id: 'AC-MOL-3', intitule: 'Caractérisation : gel d\'agarose et restriction', codes: 'C2.5 · T2.2',
          description: 'Électrophorèse avec marqueurs de taille, digestion par enzymes de restriction.',

      ] },

          description: 'Travail aseptique sous PSM II, entretien de lignées (trypsination, étuve CO2), culture in vitro de tissus végétaux, congélation et décongélation.',
          motsCles: 'culture cellulaire|lignées? cellulaires?|trypsin|\\bco2\\b|eucaryote|végéta|\\bcals?\\b|congélation',
          materiel: ['PSM II dédié', 'Étuve à CO2', 'Milieux de culture cellulaire et sérum', 'Trypsine-EDTA', 'Flasques et plaques', 'Pipettes sérologiques', 'Microscope inversé'] },
        { id: 'AC-CEL-2', intitule: 'Numération et viabilité cellulaires', codes: 'C2.6 · T2.2',
          description: 'Observation au microscope inversé, numération sur cellule hématimétrique, bleu trypan ou tests colorimétriques de viabilité.',
          motsCles: 'numération|viabilité|bleu trypan|malassez|bürker|cytotox|confluence',
          materiel: ['Cellules de Malassez ou Bürker', 'Bleu trypan', 'Microscopes', 'Réactif MTT ou équivalent', 'Lecteur de microplaques'] }
      ] },
      { nom: 'Métrologie, contrôle qualité et données (C1.2, C2.7, C2.8)', tps: [
        { id: 'AC-QUA-1', intitule: 'Contrôle et suivi métrologique des équipements', codes: 'C1.2 · C2.7',
          description: 'Vérification de pipettes, étalonnage de balances, qualification de température d\'enceintes.',
          motsCles: 'métrolog|vérification|étalonnage|gravimétr|qualification|enceintes?|balances?|pipettes?',
          materiel: ['Balance analytique', 'Masses étalons', 'Thermomètres ou enregistreurs étalonnés', 'Micropipettes à vérifier'] },
        { id: 'AC-QUA-2', intitule: 'Validation de série et incertitudes', codes: 'C2.7 · C2.8',
          description: 'Matériaux de référence, cartes de Levey-Jennings, incertitudes de mesure (ISO 5725, ISO 17025).',
          motsCles: 'levey|validation|incertitude|matériaux de référence|carte de contrôle|iso 5725|17025|fidélité|justesse',
          materiel: ['Matériaux de référence', 'Étalons-contrôles', 'Tableur de cartes de contrôle'] }
